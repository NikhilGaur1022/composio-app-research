name: Research one app
on:
  workflow_dispatch:
    inputs:
      app:
        description: "App name exactly as in apps.json (e.g. Attio)"
        required: true
jobs:
  research:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g @anthropic-ai/claude-code
      - run: pip install -r requirements.txt
      - name: Run pipeline for one app
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python -m agent.run all --app "${{ inputs.app }}" --force
      - name: Rebuild page and commit
        run: |
          python -m verification.scoring || true
          python -m page.build
          git config user.name "research-agent[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add results verification docs
          git commit -m "research: ${{ inputs.app }}" || echo "nothing to commit"
          git push
